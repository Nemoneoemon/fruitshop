<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f7a3d"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Fruit Shop Memo</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#1f2a1f;--mut:#6b7566;--line:#e4dfd0;--g:#1f7a3d;--gd:#0f5a28;--o:#f08a1c;--r:#d6403a;--b:#e2136e;--n:#f26b21;--shadow:0 2px 10px rgba(30,40,20,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12180f;--card:#1c2418;--ink:#eef3e8;--mut:#9aa693;--line:#2c3727;--g:#47c06b;--gd:#2f9f52;--shadow:none}}
:root[data-theme="dark"]{--bg:#12180f;--card:#1c2418;--ink:#eef3e8;--mut:#9aa693;--line:#2c3727;--g:#47c06b;--gd:#2f9f52;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.35 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:130px}
h1,h2,h3{font-family:system-ui,sans-serif;font-weight:800;margin:0}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:24px;color:var(--g)}header small{color:var(--mut)}
main{padding:8px 14px;max-width:640px;margin:auto}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;font:inherit;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--g);color:#fff}
input,select{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:17px;background:var(--card);color:var(--ink)}
input:focus{outline:3px solid var(--o);border-color:var(--o)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);border:2px solid transparent;font:inherit;color:var(--ink);cursor:pointer}
.p:active{border-color:var(--o);transform:scale(.97)}
.p b{display:block;font-size:34px;line-height:1.2}.p span{display:block;font-weight:800}.p i{font-style:normal;color:var(--g);font-weight:800}
.btn{width:100%;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:18px;padding:15px;margin-top:10px}
.btn.alt{background:var(--card);color:var(--g);border:2px solid var(--g)}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}.m{color:var(--mut);font-size:14px;margin:2px 0}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--o);color:#1b1100;border:0;border-radius:16px;padding:14px 16px;font:inherit;font-weight:800;font-size:18px;display:flex;justify-content:space-between;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:616px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;font-weight:800;color:var(--mut);padding:4px}
nav button b{display:block;font-size:22px}nav button.on{color:var(--g)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.s{display:flex}.sh{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{flex:1;min-width:64px;padding:11px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800}
.chips button.on{border-color:var(--g);background:var(--g);color:#fff}
.pv{font:800 30px system-ui,sans-serif;color:var(--g);text-align:center;margin:8px 0}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font:800 22px system-ui,sans-serif}.big{grid-column:span 2;background:var(--g)!important;color:#fff}.big b{font-size:34px}
.bar{height:8px;background:var(--g);border-radius:4px;margin-top:4px}
.x{border:0;background:none;color:var(--r);font-size:20px;font-weight:800}
.rc{background:#fffdf6;color:#222;border:2px dashed #bbb;border-radius:8px;padding:14px;font-family:Nunito}
.rc .row{border-color:#ddd}.tg{width:52px;height:30px;accent-color:var(--g);transform:scale(1.3)}
.pr{width:110px;text-align:right;padding:9px}
.dot{display:inline-block;padding:2px 9px;border-radius:9px;font-size:13px;font-weight:800;color:#fff}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
</style></head><body>
<header><div><h1 id="sn"></h1><small id="dt"></small></div></header>
<main id="app"></main>
<div id="cb"></div>
<nav id="nav"></nav>
<div class="ov" id="ov" onclick="if(event.target===this)closeS()"><div class="sh" id="sh"></div></div>
<script>
const K='fruitshop_v1',$=id=>document.getElementById(id);
const DEF=[['Apple – Red','🍎',260],['Apple – Green','🍏',280],['Apple – Fuji','🍎',320],['Grapes – Green','🍇',300],['Grapes – Black','🍇',360],['Grapes – Red','🍇',380],['Pear','🍐',240],['Pomegranate','🍎',320],['Orange','🍊',200],['Malta','🍊',220],['Mandarin','🍊',180],['Guava','🥝',120],['Dragon Fruit','🐉',350],['Dates – Ajwa','🌴',1800],['Dates – Mariyam','🌴',1100],['Dates – Medjool','🌴',1500],['Banana','🍌',90]];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{shop:'My Fruit Shop',n:1,prods:DEF.map((p,i)=>({id:'p'+i,name:p[0],e:p[1],price:p[2],on:true})),sales:[],pays:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};S.held=S.held||[];S.buys=S.buys||[];S.bd=S.bd||[];
const payOf=s=>s.pay||(s.paid>0?{[s.method]:s.paid}:{});
const payLbl=s=>{const p=payOf(s),k=Object.keys(p).filter(x=>p[x]>0);return k.length?k.join(' + '):'Due'};
const tot=()=>Math.max(0,R(cartTotal()-disc));
const sm=n=>S.sales.filter(s=>s.date>=day(Date.now()-(n-1)*864e5)).reduce((a,s)=>a+s.total,0);
let tab='sell',mode='w',cart=[],cust={name:'',phone:''},pm='Cash',cur=null,editId=null,disc=0,acc=false,sp={Cash:'',bKash:''};
const MC={Cash:'#1f7a3d',bKash:'#e2136e',Nagad:'#f26b21',Due:'#d6403a'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>Math.round(n*100)/100,M=n=>'৳'+R(n).toLocaleString('en-IN');
const day=(t)=>new Date(t||Date.now()).toLocaleDateString('en-CA');
const pretty=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const tm=t=>new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const key=n=>n.trim().toLowerCase();
function toast(m){let t=$('ts');if(!t){t=document.createElement('div');t.id='ts';t.style.cssText='position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#1f2a1f;color:#fff;padding:12px 16px;border-radius:12px;z-index:99;max-width:90%;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.3)';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
window.alert=toast;
let cfFn=null;function cf(msg,fn,lbl){cfFn=fn;sheet(`<h3>${msg}</h3><button class="btn" style="background:var(--r)" onclick="const f=cfFn;closeS();f&&f()">${lbl||'Yes, delete'}</button><button class="btn alt" onclick="closeS()">Cancel</button>`)}
function sheet(h){$('sh').innerHTML=h;$('ov').classList.add('s')}
function closeS(){$('ov').classList.remove('s');render()}
function setTab(t){tab=t;render();scrollTo(0,0)}
function render(){
 $('sn').textContent=S.shop;$('dt').textContent=pretty(day());
 const T=[['sell','🛒','Sell'],['rep','📊','Reports'],['due','📒','Dues'],['buy','🛍️','Buying'],['set','⚙️','Products']];
 $('nav').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="setTab('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('');
 $('app').innerHTML=({sell:vSell,rep:vRep,due:vDue,buy:vBuy,set:vSet})[tab]();
 const tot=cartTotal();
 $('cb').innerHTML=tab=='sell'&&cart.length?`<div class="cartbar" style="padding:8px 10px;gap:8px;align-items:center"><button onclick="checkout()" style="flex:1;border:0;background:none;font:inherit;font-weight:800;font-size:17px;text-align:left;color:inherit">🧾 ${cart.length} · ${M(tot)}<br><small>Review / discount</small></button><button onclick="quick()" style="border:0;border-radius:12px;background:#1b1100;color:#ffd27a;font:inherit;font-weight:800;font-size:16px;padding:12px 14px">⚡ Cash &amp; Save</button></div>`:'';
}
const cartTotal=()=>R(cart.reduce((a,l)=>a+l.amt,0));
/* SELL */
function vSell(){
 const on=S.prods.filter(p=>p.on);
 return bannerH()+`<div class="seg"><button class="${mode=='w'?'on':''}" onclick="mode='w';render()">⚖️ Weight × Price</button><button class="${mode=='a'?'on':''}" onclick="mode='a';render()">🔢 Type scale amount</button></div>
 <div class="two"><input list="cl" placeholder="Customer name" value="${esc(cust.name)}" oninput="cust.name=this.value" onchange="pick(this.value)"><input placeholder="Phone (optional)" inputmode="tel" value="${esc(cust.phone)}" oninput="cust.phone=this.value"></div><datalist id="cl">${[...new Set(S.sales.map(s=>s.name).filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
 <p class="m">${mode=='w'?'Tap a fruit, enter the kg. The price is calculated for you.':'Tap a fruit, then type the amount shown on your scale.'}</p>
 ${on.length?`<div class="grid">${on.map(p=>`<button class="p" data-n="${esc(p.name.toLowerCase())}" onclick="ask('${p.id}')"><b>${p.e}</b><span>${esc(p.name)}</span><i>${M(p.price)}/kg</i></button>`).join('')}</div>`:'<div class="empty">No fruits are switched on. Open the Products tab and turn some on.</div>'}`;
}
function ask(id){
 cur=S.prods.find(x=>x.id==id);
 sheet(`<h3>${cur.e} ${esc(cur.name)}</h3>`+(mode=='w'?`<p class="m">Price ${M(cur.price)} per kg</p><input id="q" type="number" inputmode="decimal" step="any" placeholder="Weight in kg" oninput="pv()"><div class="chips">${[.25,.5,1,2,5].map(x=>`<button onclick="$('q').value=${x};pv()">${x} kg</button>`).join('')}</div>`:`<input id="q" type="number" inputmode="decimal" step="any" placeholder="Amount from scale (৳)" oninput="pv()">`)+`<div class="pv" id="pv">৳0</div><button class="btn" onclick="addI()">Add to memo</button>`);
 setTimeout(()=>$('q').focus(),80);
}
function pv(){const v=parseFloat($('q').value)||0;$('pv').textContent=M(mode=='w'?v*cur.price:v)}
function addI(){
 const v=parseFloat($('q').value);if(!(v>0)){$('q').focus();return}
 cart.push(mode=='w'?{name:cur.name,e:cur.e,mode:'w',qty:v,price:cur.price,amt:R(v*cur.price)}:{name:cur.name,e:cur.e,mode:'a',amt:R(v)});
 closeS();
}
function lineTxt(l){return l.mode=='w'?`${l.qty} kg × ${M(l.price)}`:'Scale value'}
function shareM(id){
 const t=memoTxt(S.sales.find(x=>x.id==id));
 if(navigator.share)navigator.share({text:t}).catch(()=>{});
 else try{navigator.clipboard.writeText(t);alert('Memo copied. Paste it into WhatsApp or SMS.')}catch(e){alert(t)}
}
/* REPORTS */
function dayStats(d){
 const ss=S.sales.filter(s=>s.date==d),ps=S.pays.filter(p=>p.date==d),m={Cash:0,bKash:0,Nagad:0};
 ss.forEach(s=>{const p=payOf(s);for(const k in p)m[k]+=p[k]});ps.forEach(p=>m[p.method]+=p.amt);
 return{ss,ps,m,disc:R(ss.reduce((a,s)=>a+(s.disc||0),0)),total:R(ss.reduce((a,s)=>a+s.total,0)),due:R(ss.reduce((a,s)=>a+s.due,0)),coll:R(ps.reduce((a,p)=>a+p.amt,0))};
}
function vRep(){
 const t=dayStats(day()),dates=[...new Set(S.sales.map(s=>s.date))].sort().reverse(),st=dates.map(d=>[d,dayStats(d)]),mx=Math.max(1,...st.map(x=>x[1].total));
 const since=day(Date.now()-29*864e5),top={};S.sales.filter(s=>s.date>=since).forEach(s=>s.items.forEach(l=>{top[l.name]=(top[l.name]||0)+l.amt}));
 const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5),tm_=tp.length?tp[0][1]:1;
 return `<div class="stat"><div class="big"><span>Today’s total sale</span><b>${M(t.total)}</b><span>${t.ss.length} memo${t.ss.length==1?'':'s'}</span></div>
 ${['Cash','bKash'].map(m=>`<div><span style="color:${MC[m]}">● ${m} received</span><b>${M(t.m[m])}</b></div>`).join('')}
 <div><span style="color:var(--r)">● New due today</span><b>${M(t.due)}</b></div><div><span style="color:var(--o)">● Discount given today</span><b>${M(t.disc)}</b></div></div>
 ${t.coll?`<p class="m">Includes ${M(t.coll)} collected from old dues today.</p>`:''}
 <div class="card" style="margin-top:10px"><div class="row"><span>Last 7 days sale</span><b>${M(sm(7))}</b></div><div class="row"><span>Last 30 days sale</span><b>${M(sm(30))}</b></div><div class="row"><span>Total receivable (all dues)</span><b style="color:var(--r)">${M(dues().reduce((a,x)=>a+x.bal,0))}</b></div></div>
 <h3 style="margin:16px 0 6px">Today by fruit</h3><div class="card">${prodRows(t.ss)}</div><h3 style="margin:16px 0 6px">Daily history</h3>
 ${st.length?st.map(([d,x])=>`<div class="card" onclick="dayView('${d}')"><div class="row" style="border:0;padding:0"><b>${pretty(d)}</b><b>${M(x.total)}</b></div><div class="bar" style="width:${x.total/mx*100}%"></div><p class="m">${x.ss.length} memos · Cash ${M(x.m.Cash)} · bKash ${M(x.m.bKash)} ${x.m.Nagad?' · Nagad '+M(x.m.Nagad):''} · Due ${M(x.due)} · Discount ${M(x.disc)}</p></div>`).join(''):'<div class="empty">No sales yet. Your daily history will appear here after the first memo.</div>'}
 ${tp.length?`<h3 style="margin:16px 0 6px">Best sellers (last 30 days)</h3><div class="card">${tp.map(([n,v])=>`<div style="padding:5px 0"><div class="row" style="border:0;padding:0"><span>${esc(n)}</span><b>${M(v)}</b></div><div class="bar" style="width:${v/tm_*100}%;background:var(--o)"></div></div>`).join('')}</div>`:''}`;
}
function dayView(d){
 const x=dayStats(d);
 sheet(`<h3>${pretty(d)}</h3><div class="stat"><div class="big"><span>Total sale</span><b>${M(x.total)}</b></div>${['Cash','bKash'].map(m=>`<div><span>${m}</span><b>${M(x.m[m])}</b></div>`).join('')}<div><span>Due given</span><b>${M(x.due)}</b></div><div><span>Discount given</span><b>${M(x.disc)}</b></div></div><h3 style="margin:14px 0 4px">By fruit</h3>${prodRows(x.ss)}
 <h3 style="margin:14px 0 4px">Memos</h3>${x.ss.map(s=>`<div class="row" onclick="showMemo(${s.id})"><span>#${s.no} ${tm(s.ts)} ${esc(s.name||'Walk-in')}<div class="m">${s.items.length} items</div></span><span><b>${M(s.total)}</b> <span class="dot" style="background:${MC[Object.keys(payOf(s))[0]||'Due']}">${payLbl(s)}</span></span></div>`).join('')}
 ${x.ps.length?`<h3 style="margin:14px 0 4px">Due collected</h3>${x.ps.map(p=>`<div class="row"><span>${esc(p.name)}</span><b>${M(p.amt)} ${p.method}</b></div>`).join('')}`:''}
 <button class="x" style="margin-top:10px;width:100%" onclick="delDay('${d}')">🗑 Delete this whole day (test data)</button>
 <button class="btn alt" onclick="closeS()">Close</button>`);
}
/* DUES */
function dues(){
 const m={};S.sales.forEach(s=>{if(s.due>0){const k=key(s.name);m[k]=m[k]||{name:s.name,phone:s.phone,bal:0,list:[]};m[k].bal+=s.due;m[k].phone=s.phone||m[k].phone;m[k].list.push(s)}});
 S.pays.forEach(p=>{const k=key(p.name);if(m[k])m[k].bal-=p.amt});
 return Object.entries(m).map(([k,v])=>({k,...v,bal:R(v.bal)})).filter(v=>v.bal>0).sort((a,b)=>b.bal-a.bal);
}
function vDue(){
 const d=dues(),tt=R(d.reduce((a,x)=>a+x.bal,0)),now=Date.now();
 return `<div class="stat"><div class="big"><span>Total accounts receivable</span><b>${M(tt)}</b><span>${d.length} customer${d.length==1?'':'s'} owe you</span></div></div><div style="height:10px"></div>`+
 (d.length?d.map((x,i)=>{const o=x.list.reduce((a,s)=>Math.min(a,s.ts),now),n=Math.floor((now-o)/864e5),c=n>14?'#d6403a':n>6?'#f08a1c':'#1f7a3d';
  return `<div class="card" onclick="dueView(${i})"><div class="row" style="border:0;padding:0"><b>${esc(x.name)}</b><b style="color:var(--r)">${M(x.bal)}</b></div><p class="m">${esc(x.phone||'')} ${n<1?'Since today':'Waiting '+n+' day'+(n>1?'s':'')} <span class="dot" style="background:${c}">${n>14?'Overdue':n>6?'Follow up':'New'}</span></p></div>`}).join(''):'<div class="empty">No dues 🎉<br>When a customer pays less than the total, the rest appears here.</div>')}
function dueView(i){
 const x=dues()[i];if(!x)return closeS();if(pm!='bKash')pm='Cash';
 sheet(`<h3>${esc(x.name)}</h3>${x.phone?`<p><a href="tel:${esc(x.phone)}" style="color:var(--g);font-weight:800">📞 Call ${esc(x.phone)}</a></p>`:''}<div class="pv" style="color:var(--r)">${M(x.bal)} due</div>
 ${x.list.map(s=>`<div class="row" onclick="showMemo(${s.id})"><span>#${s.no} · ${pretty(s.date)}</span><span>${M(s.due)} of ${M(s.total)}</span></div>`).join('')}
 <p class="m" style="margin-top:12px">Customer pays now (full amount is filled in):</p><input id="pa" type="number" inputmode="decimal" value="${x.bal}">
 <div class="chips">${['Cash','bKash'].map(m=>`<button class="${pm==m?'on':''}" onclick="pm='${m}';dueView(${i})">${m}</button>`).join('')}</div>
 <button class="btn" onclick="collect(${i})">✔ Receive payment</button>
 <button class="btn alt" onclick="remind(${i})">💬 Share reminder message</button>
 <button class="btn alt" onclick="renameC(${i})">✏️ Rename / add phone</button>`)}
function collect(i){const x=dues()[i],a=Math.min(R(parseFloat($('pa').value)||0),x.bal);if(a<=0)return;S.pays.push({id:Date.now(),ts:Date.now(),date:day(),name:x.name,amt:a,method:pm});save();closeS()}
function renameC(i){const x=dues()[i];if(!x)return;sheet(`<h3>✏️ Customer</h3><input id="rn" value="${esc(x.name)}" placeholder="Name" style="margin:8px 0"><input id="rp" value="${esc(x.phone||'')}" inputmode="tel" placeholder="Phone"><button class="btn" onclick="renameGo('${x.k.replace(/['\\]/g,'')}')">Save</button><button class="btn alt" onclick="closeS()">Cancel</button>`)}
function renameGo(k){const n=$('rn').value.trim(),p=$('rp').value.trim();if(!n)return;S.sales.forEach(s=>{if(key(s.name).replace(/['\\]/g,'')==k){s.name=n;if(p)s.phone=p}});S.pays.forEach(q=>{if(key(q.name).replace(/['\\]/g,'')==k)q.name=n});save();closeS()}
function remind(i){const x=dues()[i],t=`Dear ${x.name}, your due at ${S.shop} is ${x.bal} Tk. Please pay when you can. Thank you!`;if(navigator.share)navigator.share({text:t}).catch(()=>{});else try{navigator.clipboard.writeText(t);alert('Message copied.')}catch(e){alert(t)}}
/* PRODUCTS */
function vSet(){
 return `<p class="m">✏️ Tap any emoji or name to rewrite it. 🗑 deletes a fruit. You can add as many fruits as you like.</p>
 <p class="m">Switch a fruit off when it is out of season: it disappears from the Sell screen but stays here. Change the price any time (per kg).</p>

function finish(){
 const t=tot(),pay={};let paid=0;
 ['Cash','bKash'].forEach(m=>{const v=R(parseFloat(sp[m])||0);if(v>0){pay[m]=v;paid+=v}});
 if(!paid&&!acc&&t>0){pay.Cash=t;paid=t}
 paid=R(paid);const ex=R(paid-t);
 if(ex>0){if((pay.Cash||0)>=ex){pay.Cash=R(pay.Cash-ex);if(!pay.Cash)delete pay.Cash;paid=t}else{alert('bKash is more than the total.');return}}
 const due=R(t-paid),old=editId&&S.sales.find(x=>x.id==editId),no=old?old.no:S.n,nm=cust.name.trim()||(due>0?'Customer #'+no:'');
 const b={name:nm,phone:cust.phone.trim(),items:cart,sub:cartTotal(),disc,total:t,pay,paid,due};let s;
 if(old){s=old;Object.assign(s,b);delete s.method}else{s={id:Date.now(),no:S.n++,ts:Date.now(),date:day(),...b};S.sales.push(s)}
 clr();save();showMemo(s.id,true)}

function pe(id,v){S.prods.find(p=>p.id==id).e=v.trim()||'🍓';save();render()}
function delP(id){const p=S.prods.find(x=>x.id==id);cf('Delete '+esc(p.name)+'? Old memos keep their records. To hide it only for the season, use the switch instead.',()=>{S.prods=S.prods.filter(x=>x.id!=id);save()})}
function wipe(w){cf(w=='sales'?'Delete ALL sales, memos and dues?':w=='buys'?'Delete ALL buying records?':'Delete ALL sales and buying records?',()=>{if(w!='buys'){S.sales=[];S.pays=[];S.held=[];S.n=1}if(w!='sales'){S.buys=[];S.bd=[]}save();toast('Deleted ✔')},'Yes, delete everything')}
const q_=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csv=r=>'\ufeff'+r.map(x=>x.map(q_).join(',')).join('\r\n');
function exp(w){let t,n='fruitshop-'+w+'-'+day()+'.csv';
 if(w=='sales'){const r=[['Memo','Date','Time','Customer','Phone','Fruit','Type','Qty_kg','Price_per_kg','Line_amount','Subtotal','Discount','Memo_total','Cash','bKash','Nagad','Due']];S.sales.forEach(s=>{const p=payOf(s);s.items.forEach(l=>r.push([s.no,s.date,tm(s.ts),s.name,s.phone,l.name,l.mode=='w'?'Weight':'Scale value',l.mode=='w'?l.qty:'',l.mode=='w'?l.price:'',l.amt,s.sub||s.total+(s.disc||0),s.disc||0,s.total,p.Cash||0,p.bKash||0,p.Nagad||0,s.due]))});t=csv(r)}
 else if(w=='days'){const ds=[...new Set(S.sales.map(s=>s.date).concat(S.pays.map(p=>p.date),S.buys.map(b=>b.date)))].sort(),r=[['Date','Memos','Sales','Discount','Cash_received','bKash_received','Nagad_received','Due_given','Due_collected','Fruit_buying','Extra_costs','Total_buying']];ds.forEach(d=>{const x=dayStats(d),b=S.buys.filter(z=>z.date==d),c=bsum(b.filter(z=>z.kind=='cost')),f=bsum(b)-c;r.push([d,x.ss.length,x.total,x.disc,x.m.Cash,x.m.bKash,x.m.Nagad,x.due,x.coll,f,c,R(f+c)])});t=csv(r)}
 else if(w=='buys'){const r=[['Date','Type','Item_or_cost','Qty','Unit','Rate','Amount','Supplier','Note','Purchase_ID']];S.buys.forEach(b=>r.push([b.date,b.kind=='cost'?'Extra cost':'Fruit',b.name,b.kind=='cost'?'':b.qty,b.unit,b.rate,b.amt,b.supplier,b.note,b.bid||b.id]));t=csv(r)}
 else if(w=='pays'){const r=[['Date','Customer','Amount','Method']];S.pays.forEach(p=>r.push([p.date,p.name,p.amt,p.method]));t=csv(r)}
 else{t=JSON.stringify(S);n='fruitshop-backup-'+day()+'.json'}
 dl(n,t)}
async function dl(name,txt){try{if(!window.claude){const u=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Saved ✔');return}const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data:txt});toast('Saved ✔')}catch(e){if(e&&e.code=='declined')return;showText(name,txt)}}
function showText(name,txt){sheet(`<h3>${esc(name)}</h3><p class="m">Saving a file is not available here. Tap Copy, then paste into Notes, Google Sheets or Excel.</p><textarea id="tx" readonly style="width:100%;height:200px;font-size:13px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)">${esc(txt)}</textarea><button class="btn" onclick="cpy()">📋 Copy</button><button class="btn alt" onclick="closeS()">Close</button>`)}
function cpy(){const t=$('tx');t.focus();t.select();t.setSelectionRange(0,1e9);let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Copied ✔':'Press and hold the text, then tap Copy')}
function restoreUI(){sheet(`<h3>♻️ Restore backup</h3><p class="m">Choose your backup file (.json):</p><input type="file" accept=".json,.txt" onchange="rf(this)"><p class="m" style="margin-top:10px">Or paste the backup text here:</p><textarea id="rt" style="width:100%;height:120px;font-size:13px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)"></textarea><button class="btn" onclick="restoreGo($('rt').value)">Restore</button><button class="btn alt" onclick="closeS()">Cancel</button>`)}
function rf(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreGo(r.result);r.readAsText(f)}
function restoreGo(t){try{const d=JSON.parse(String(t).replace(/^\ufeff/,''));if(!d.prods||!d.sales)throw 0;S=d;S.held=S.held||[];S.buys=S.buys||[];S.bd=S.bd||[];S.pays=S.pays||[];save();closeS();toast('Restored ✔')}catch(e){toast('That backup is not valid')}}
function addP(){const n=$('nn').value.trim(),p=parseFloat($('np').value)||0;if(!n)return alert('Enter a name');S.prods.push({id:'p'+Date.now(),name:n,e:($('ne').value.trim()||'🍓'),price:p,on:true});save();render()}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
