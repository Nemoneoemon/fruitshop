<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f7a3d">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fruit Shop Memo</title>
<style>
:root{
 --bg:#faf7ef;--bg2:#f1ece0;--card:#fff;--ink:#1a2318;--ink2:#4a5544;--mut:#7d877a;
 --line:#e6e0d1;--line2:#d4cdb8;
 --g:#1f7a3d;--g2:#155c2d;--g3:#e8f3ec;
 --o:#e07a12;--o2:#fff3e2;
 --r:#c93630;--r2:#fbe9e7;
 --b:#d4125e;--n:#e8590c;
 --shadow:0 1px 2px rgba(30,40,20,.04),0 4px 14px rgba(30,40,20,.06);
 --shadow-lg:0 4px 12px rgba(30,40,20,.08),0 16px 40px rgba(30,40,20,.12);
 --r-card:16px;--r-btn:12px;--r-pill:999px;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#0f1410;--bg2:#161c17;--card:#1a221b;--ink:#e8efe4;--ink2:#b8c4b4;--mut:#7a8677;
  --line:#283226;--line2:#36432f;
  --g:#4fce74;--g2:#3aab5e;--g3:#1a2a1e;
  --o:#f0a24a;--o2:#2a1f12;
  --r:#f0645e;--r2:#2a1513;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
 }
}
:root[data-theme="dark"]{
 --bg:#0f1410;--bg2:#161c17;--card:#1a221b;--ink:#e8efe4;--ink2:#b8c4b4;--mut:#7a8677;
 --line:#283226;--line2:#36432f;
 --g:#4fce74;--g2:#3aab5e;--g3:#1a2a1e;
 --o:#f0a24a;--o2:#2a1f12;
 --r:#f0645e;--r2:#2a1513;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);
 --shadow-lg:0 4px 12px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:var(--safe-t)}
body{
 margin:0;background:var(--bg);color:var(--ink);
 font:500 16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 padding-top:var(--safe-t);padding-bottom:calc(84px + var(--safe-b));
 overscroll-behavior-y:contain;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}
a{color:var(--g);text-decoration:none;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{
 width:100%;padding:12px 14px;border:1.5px solid var(--line);
 border-radius:var(--r-btn);font:inherit;font-size:16px;
 background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
 outline:none;border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 20%,transparent)
}
input::placeholder{color:var(--mut);opacity:1}

/* Layout */
header{
 padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center;
 background:var(--bg);position:sticky;top:0;z-index:3;
}
header .brand{display:flex;align-items:center;gap:10px}
header .logo{
 width:36px;height:36px;border-radius:10px;background:var(--g);
 display:grid;place-items:center;font-size:20px;color:#fff;
 box-shadow:var(--shadow);
}
header h1{font-size:20px;color:var(--ink)}
header small{color:var(--mut);font-size:12px;font-weight:500;display:block;margin-top:1px}
main{padding:0 14px 20px;max-width:640px;margin:auto}
.section-title{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}

/* Nav */
nav{
 position:fixed;bottom:0;left:0;right:0;background:var(--card);
 border-top:1px solid var(--line);display:flex;
 padding:6px 6px calc(6px + var(--safe-b));z-index:4;
}
nav button{
 flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:600;
 color:var(--mut);padding:6px 4px;border-radius:10px;
 display:flex;flex-direction:column;align-items:center;gap:3px;
 transition:color .15s,background .15s;
}
nav button .ic{font-size:22px;line-height:1}
nav button.on{color:var(--g);background:var(--g3)}

/* Cards */
.card{
 background:var(--card);border-radius:var(--r-card);padding:14px;
 margin-bottom:10px;box-shadow:var(--shadow);
 border:1px solid color-mix(in srgb,var(--line) 50%,transparent);
}
.card.flat{box-shadow:none}
.card.warn{border-left:3px solid var(--r)}
.card.info{border-left:3px solid var(--o)}

/* Rows */
.row{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
.m{color:var(--mut);font-size:13px;margin:2px 0;font-weight:500}
.m b{color:var(--ink)}

/* Buttons */
.btn{
 width:100%;border:0;border-radius:var(--r-btn);
 background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:16px;
 padding:14px;margin-top:10px;transition:transform .08s,filter .15s;
}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn.alt{background:var(--card);color:var(--g);border:1.5px solid var(--g)}
.btn.danger{background:var(--r)}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;margin-top:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-group{display:flex;gap:8px}
.btn-group .btn{margin-top:0}

/* Segmented control */
.seg{
 display:flex;background:var(--bg2);border-radius:12px;padding:3px;
 margin-bottom:12px;gap:2px;
}
.seg button{
 flex:1;border:0;background:none;padding:10px 6px;
 border-radius:9px;font:inherit;font-weight:600;font-size:14px;color:var(--ink2);
 transition:background .15s,color .15s;
}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{
 padding:9px 14px;border-radius:var(--r-pill);
 border:1.5px solid var(--line);background:var(--card);color:var(--ink);
 font:inherit;font-weight:600;font-size:14px;transition:all .15s;
}
.chips button.on{border-color:var(--g);background:var(--g);color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}

/* Fruit grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{
 background:var(--card);border-radius:var(--r-card);padding:16px 10px;
 text-align:center;box-shadow:var(--shadow);border:1.5px solid transparent;
 font:inherit;color:var(--ink);cursor:pointer;
 transition:border-color .1s,transform .08s;
 display:flex;flex-direction:column;align-items:center;gap:2px;
}
.p:active{border-color:var(--g);transform:scale(.97)}
.p b{display:block;font-size:34px;line-height:1.15}
.p span{display:block;font-weight:600;font-size:14px;line-height:1.2}
.p i{font-style:normal;color:var(--g);font-weight:700;font-size:12px;margin-top:2px}

/* Cart bar */
.cartbar{
 position:fixed;left:12px;right:12px;bottom:calc(74px + var(--safe-b));
 background:var(--ink);color:var(--bg);
 border:0;border-radius:14px;padding:12px 14px;
 font:inherit;font-weight:700;
 display:flex;justify-content:space-between;align-items:center;gap:8px;
 box-shadow:var(--shadow-lg);max-width:616px;margin:auto;z-index:3;
}
.cartbar .left{flex:1;text-align:left;background:none;border:0;color:inherit;font:inherit;font-weight:700;text-align:left;padding:0}
.cartbar .left small{font-weight:500;opacity:.7;font-size:12px;display:block;margin-top:2px}
.cartbar .right{
 border:0;border-radius:10px;background:var(--o);color:#1a0f00;
 font:inherit;font-weight:700;font-size:14px;padding:10px 14px;
}

/* Sheet / overlay */
.ov{
 position:fixed;inset:0;background:rgba(0,0,0,.45);
 display:none;align-items:flex-end;justify-content:center;z-index:9;
 backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.ov.s{display:flex;animation:fadeIn .15s ease-out}
.sh{
 background:var(--bg);width:100%;max-width:640px;
 max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
 border-radius:22px 22px 0 0;
 padding:20px 16px calc(20px + var(--safe-b));
 animation:slideUp .22s cubic-bezier(.16,1,.3,1);
}
.sh::before{
 content:'';display:block;width:36px;height:4px;border-radius:2px;
 background:var(--line2);margin:-8px auto 14px;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
 .ov.s{animation:none}.sh{animation:none}*{transition:none!important}
}

/* Stat blocks */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat > div{
 background:var(--card);border-radius:14px;padding:14px;
 box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 50%,transparent);
}
.stat > div > span{font-size:12px;font-weight:600;color:var(--mut);display:block}
.stat > div b{display:block;font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.stat .big{grid-column:span 2;background:var(--g);color:#fff}
.stat .big b{font-size:30px}
.stat .big span{color:rgba(255,255,255,.8)}
.stat .big.warn{background:var(--r)}
.stat .big.orange{background:var(--o);color:#1a0f00}
.stat .big.orange span{color:rgba(26,15,0,.7)}

/* Bar */
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar > div{height:100%;background:var(--g);border-radius:3px;transition:width .3s}
.bar.orange > div{background:var(--o)}
.bar.red > div{background:var(--r)}

/* Preview */
.pv{font:700 32px/1.1 system-ui,sans-serif;color:var(--g);text-align:center;margin:10px 0;letter-spacing:-.02em}
.pv.red{color:var(--r)}
.pv.sm{font-size:20px}

/* Receipt */
.rc{
 background:var(--card);color:var(--ink);
 border:1.5px dashed var(--line2);border-radius:10px;padding:16px;
 font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:14px;
}
.rc h3{font-family:system-ui,sans-serif;text-align:center;font-size:18px;margin-bottom:4px}
.rc .row{padding:6px 0;border-color:var(--line)}

/* Dot */
.dot{
 display:inline-block;padding:3px 10px;border-radius:var(--r-pill);
 font-size:11px;font-weight:700;color:#fff;letter-spacing:.02em;
}

/* Empty */
.empty{
 text-align:center;color:var(--mut);padding:48px 20px;
 font-weight:500;
}
.empty .ic{font-size:48px;display:block;margin-bottom:12px;opacity:.6}
.empty h3{color:var(--ink);margin-bottom:6px}

/* Toast */
#ts{
 position:fixed;left:50%;top:calc(14px + var(--safe-t));
 transform:translateX(-50%);background:var(--ink);color:var(--bg);
 padding:12px 18px;border-radius:12px;z-index:99;
 max-width:90vw;font-weight:600;font-size:14px;
 box-shadow:var(--shadow-lg);
 animation:toastIn .2s cubic-bezier(.16,1,.3,1);
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Keypad */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.keypad button{
 padding:16px;border:1.5px solid var(--line);border-radius:12px;
 background:var(--card);font:inherit;font-weight:700;font-size:20px;
 transition:background .1s,transform .08s;
}
.keypad button:active{background:var(--g3);transform:scale(.96)}
.keypad button.wide{grid-column:span 2}

/* Numeric input display */
.numdisp{
 text-align:right;padding:16px;border:1.5px solid var(--line);
 border-radius:12px;background:var(--bg2);font-size:28px;font-weight:700;
 font-family:'SF Mono',ui-monospace,monospace;letter-spacing:.02em;
 min-height:64px;display:flex;align-items:center;justify-content:flex-end;
}

/* PIN keypad */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:20px 0}
.pin-dots i{
 width:14px;height:14px;border-radius:50%;background:var(--line2);
 transition:background .15s,transform .15s;
}
.pin-dots i.on{background:var(--g);transform:scale(1.15)}

/* Customer card */
.cust-card{
 background:var(--card);border-radius:var(--r-card);padding:14px;
 box-shadow:var(--shadow);margin-bottom:10px;
 border:1px solid color-mix(in srgb,var(--line) 50%,transparent);
 cursor:pointer;transition:transform .08s;
}
.cust-card:active{transform:scale(.99)}

/* Skeleton */
.sk{background:var(--line);border-radius:6px;height:14px;animation:sk 1.4s infinite}
@keyframes sk{0%,100%{opacity:.5}50%{opacity:1}}

/* Toggle switch */
.tg{
 appearance:none;width:48px;height:28px;background:var(--line2);
 border-radius:14px;position:relative;cursor:pointer;transition:background .15s;
 flex-shrink:0;
}
.tg::after{
 content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;
 background:#fff;border-radius:50%;transition:transform .18s cubic-bezier(.16,1,.3,1);
 box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.tg:checked{background:var(--g)}
.tg:checked::after{transform:translateX(20px)}

/* Small helpers */
.mono{font-family:'SF Mono',ui-monospace,monospace}
.mt0{margin-top:0}.mb0{margin-bottom:0}
.mt8{margin-top:8px}.mb8{margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.flex{display:flex;align-items:center;gap:8px}
.flex.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div id="app-loading" style="padding:40px 20px;text-align:center;color:var(--mut)">
  <div style="font-size:48px;margin-bottom:16px">🍎</div>
  <div class="sk" style="width:60%;margin:8px auto"></div>
  <div class="sk" style="width:40%;margin:8px auto;height:10px"></div>
  <p class="m" style="margin-top:24px">Loading your shop data…</p>
</div>

<div id="root" style="display:none">
  <header>
    <div class="brand">
      <div class="logo">🍎</div>
      <div>
        <h1 id="sn">Fruit Shop</h1>
        <small id="dt"></small>
      </div>
    </div>
  </header>
  <main id="app"></main>
  <div id="cb"></div>
  <nav id="nav"></nav>
</div>

<div class="ov" id="ov"><div class="sh" id="sh"></div></div>

<script>
'use strict';

/* ==========================================================
   DB LAYER — IndexedDB with localStorage migration
   ========================================================== */
const DB_NAME='fruitshop_db', DB_VER=1;
const STORES={
  state: 'state',       // one row: meta (shop, n, custs, prods, lastBackup, pin)
  sales: 'sales',       // {id, no, ts, date, custId, name, phone, items, sub, disc, total, pay, paid, due}
  pays: 'pays',         // {id, ts, date, name, custId, amt, method}
  buys: 'buys',         // {id, bid, kind, date, name, qty, unit, rate, amt, supplier, note}
  waste: 'waste'        // {id, date, name, qty, kg, reason, cost}
};
let db=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORES.state))d.createObjectStore(STORES.state);
      if(!d.objectStoreNames.contains(STORES.sales))d.createObjectStore(STORES.sales,{keyPath:'id'});
      if(!d.objectStoreNames.contains(STORES.pays))d.createObjectStore(STORES.pays,{keyPath:'id'});
      if(!d.objectStoreNames.contains(STORES.buys))d.createObjectStore(STORES.buys,{keyPath:'id'});
      if(!d.objectStoreNames.contains(STORES.waste))d.createObjectStore(STORES.waste,{keyPath:'id'});
    };
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error('DB blocked — close other tabs'));
  });
}
function tx(store,mode='readonly'){
  return db.transaction(store,mode).objectStore(store);
}
function dbGet(store,key){return new Promise((res,rej)=>{const r=tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbPut(store,val,key){return new Promise((res,rej)=>{const s=tx(store,'readwrite');const r=key?s.put(val,key):s.put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbDel(store,key){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function dbAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function dbClear(store){return new Promise((res,rej)=>{const r=tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

/* ==========================================================
   STATE
   ========================================================== */
const DEF=[['Apple – Red','🍎',260],['Apple – Green','🍏',280],['Apple – Fuji','🍎',320],['Grapes – Green','🍇',300],['Grapes – Black','🍇',360],['Grapes – Red','🍇',380],['Pear','🍐',240],['Pomegranate','🍎',320],['Orange','🍊',200],['Malta','🍊',220],['Mandarin','🍊',180],['Guava','🥝',120],['Dragon Fruit','🐉',350],['Dates – Ajwa','🌴',1800],['Dates – Mariyam','🌴',1100],['Dates – Medjool','🌴',1500],['Banana','🍌',90]];

let S = {
  shop:'My Fruit Shop', n:1,
  prods: DEF.map((p,i)=>({id:'p'+i,name:p[0],e:p[1],price:p[2],on:true})),
  custs: [],
  lastBackup: 0,
  pin: null,     // {hash, salt} — null = no PIN
  createdAt: Date.now()
};
let SALES = [], PAYS = [], BUYS = [], WASTE = [];

/* UI state */
let tab='sell', mode='w', cart=[], cust={name:'',phone:''}, pm='Cash';
let cur=null, editId=null, disc=0, acc=false;
let sp={Cash:'',bKash:'',Nagad:''};
let bper='t', bu='kg', bi='', bc='';
let pinBuffer='', pinMode='lock', pinPending=null;
let locked=false, lockTimer=null;
const LOCK_MS=5*60*1000;

/* ==========================================================
   HELPERS
   ========================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = n => Math.round((n||0)*100)/100;
const M = n => '৳'+R(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const day = (t=Date.now()) => new Date(t).toLocaleDateString('en-CA');
const pretty = d => new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const tm = t => new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const key = n => (n||'').trim().toLowerCase();
const MC = {Cash:'#1f7a3d',bKash:'#d4125e',Nagad:'#e8590c',Due:'#c93630'};

function toast(m,dur=3200){
  let t=$('ts');
  if(!t){t=document.createElement('div');t.id='ts';document.body.appendChild(t)}
  t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',dur);
}
window.alert = m => toast(m);
function haptic(){try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}

/* ==========================================================
   CUSTOMERS
   ========================================================== */
function findCust(id){return S.custs.find(c=>c.id===id)}
function ensureCust(name,phone){
  name=(name||'').trim();
  if(!name)return null;
  const existing=S.custs.find(c=>key(c.name)===key(name));
  if(existing){if(phone)existing.phone=phone;return existing}
  const c={id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name,phone:phone||'',createdAt:Date.now()};
  S.custs.push(c);return c;
}
function custStats(cid){
  let total=0,due=0,memos=0,paid=0;
  SALES.forEach(s=>{if(s.custId!==cid)return;total+=s.total;due+=s.due||0;memos++});
  PAYS.forEach(p=>{if(p.custId===cid)paid+=p.amt});
  return {total:R(total),due:R(due-paid),paid:R(paid),memos};
}

/* ==========================================================
   PAYMENTS
   ========================================================== */

/* ==========================================================
   DUES
   ========================================================== */
function dues(){
  const m={};
  SALES.forEach(s=>{if(s.due>0){const k=s.custId||'name:'+key(s.name);m[k]=m[k]||{id:k,custId:s.custId,name:s.name,phone:s.phone,bal:0,list:[]};m[k].bal+=s.due;if(s.phone)m[k].phone=s.phone;m[k].list.push(s)}});
  PAYS.forEach(p=>{const k=p.custId||'name:'+key(p.name);if(m[k])m[k].bal-=p.amt});
  return Object.values(m).map(v=>({...v,bal:R(v.bal)})).filter(v=>v.bal>0.01).sort((a,b)=>b.bal-a.bal);
}

/* ==========================================================
   PROFIT — weighted-average buy cost per fruit
   ========================================================== */
function buyStats(){
  // weight average buy rate per (fruit name lowercased); keyed separately by unit if mixed
  const byName={};
  BUYS.forEach(b=>{
    if(b.kind==='cost')return;
    const k=key(b.name);
    const cur=byName[k]||(byName[k]={qty:{},amt:0,unitQty:{}});
    cur.amt+=b.amt;
    cur.qty[b.unit]=(cur.qty[b.unit]||0)+b.qty;
  });
  const avg={};
  Object.entries(byName).forEach(([k,v])=>{
    // weighted avg across unit types — approximate by treating each unit as its own cost/kg
    let totalQty=0,totalAmt=0;
    Object.entries(v.qty).forEach(([u,q])=>{totalQty+=q;totalAmt+=v.amt*(q/(Object.values(v.qty).reduce((a,b)=>a+b,0)||1))});
    const units=Object.keys(v.qty);
    // If all kg — straightforward. Otherwise leave undefined (can't compare to kg sales).
    if(units.length===1&&units[0]==='kg'){avg[k]={perKg:v.amt/v.qty.kg,amt:v.amt,qty:v.qty.kg}}
    else{avg[k]={perKg:null,amt:v.amt,qty:Object.values(v.qty).reduce((a,b)=>a+b,0),units}}
  });
  return avg;
}
function profitStats(days){
  const since=day(Date.now()-(days-1)*864e5);
  const avg=buyStats();
  let revenue=0,cogs=0,extra=0,wasteCost=0;
  const perFruit={};
  SALES.forEach(s=>{
    if(s.date<since)return;
    s.items.forEach(l=>{
      revenue+=l.amt;
      const buy=avg[key(l.name)];
      let lineCost=0;
      if(buy&&buy.perKg!=null&&l.mode==='w')lineCost=buy.perKg*l.qty;
      cogs+=lineCost;
      const k=key(l.name);
      perFruit[k]=perFruit[k]||{name:l.name,em:l.e,revenue:0,cost:0,kg:0,unitCost:buy&&buy.perKg};
      perFruit[k].revenue+=l.amt;
      perFruit[k].cost+=lineCost;
      if(l.mode==='w')perFruit[k].kg+=l.qty;
    });
  });
  BUYS.forEach(b=>{if(b.date>=since&&b.kind==='cost')extra+=b.amt});
  WASTE.forEach(w=>{if(w.date>=since)wasteCost+=w.cost||0});
  const gross=R(revenue-cogs);
  const net=R(gross-extra-wasteCost);
  return {revenue:R(revenue),cogs:R(cogs),extra:R(extra),waste:R(wasteCost),gross,net,perFruit};
}

let saveTimer=null;

async function save(){
  try{
    await dbPut(STORES.state,S,'meta');
    // Persist small collections whole (cheap, atomic)
    for(const s of SALES){await dbPut(STORES.sales,s)}
    for(const p of PAYS){await dbPut(STORES.pays,p)}
    for(const b of BUYS){await dbPut(STORES.buys,b)}
    for(const w of WASTE){await dbPut(STORES.waste,w)}
    return true;
  }catch(e){
    console.error('save',e);
    toast('⚠️ Save failed: '+(e.message||e.name||'storage error'));
    return false;
  }
}

/* ==========================================================
   PIN (SHA-256)
   ========================================================== */
async function sha256(str){
  const buf=new TextEncoder().encode(str);
  const hash=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function setPin(pin){
  const salt=Math.random().toString(36).slice(2,10);
  S.pin={hash:await sha256(salt+pin),salt};
  await save();
}
async function verifyPin(pin){
  if(!S.pin)return true;
  return (await sha256(S.pin.salt+pin))===S.pin.hash;
}

   ========================================================== */
async function migrateFromLS(){
  const raw = localStorage.getItem('fruitshop_v2') || localStorage.getItem('fruitshop_v1');
  if(!raw)return false;
  try{
    const d=JSON.parse(raw);
    if(!d||!Array.isArray(d.prods))return false;
    S.shop=d.shop||S.shop;S.n=d.n||1;S.prods=d.prods;S.custs=d.custs||[];
    SALES=[];(d.sales||[]).forEach(s=>{SALES.push(s)});
    PAYS=[];(d.pays||[]).forEach(p=>{PAYS.push(p)});
    BUYS=[];(d.buys||[]).forEach(b=>{BUYS.push(b)});
    WASTE=[];
    await save();
    localStorage.removeItem('fruitshop_v2');localStorage.removeItem('fruitshop_v1');
    toast('✔ Imported old data into the new storage');
    return true;
  }catch(e){console.warn('migration',e);return false}
}

  if(!paid&&!acc&&t>0){
    if(old){Object.assign(pay,payOf(old));paid=Object.values(pay).reduce((a,b)=>a+b,0)}
    else{pay.Cash=t;paid=t}
  }
  paid=R(paid);
  const ex=R(paid-t);
  if(ex>0){let big='Cash';['Cash','bKash','Nagad'].forEach(m=>{if((pay[m]||0)>(pay[big]||0))big=m});pay[big]=R((pay[big]||0)-ex);if(pay[big]<=0)delete pay[big];paid=t}
  const due=R(Math.max(0,t-paid));
  const no=old?old.no:S.n;
  const name=cust.name.trim()||(due>0?'Customer #'+no:'');
  const c=name?ensureCust(name,cust.phone):null;
  const custId=c?c.id:(old?old.custId:null);
  const b={name,phone:cust.phone.trim(),custId,items:cart,sub:cartTotal(),disc,total:t,pay,paid,due};
  let s;
  if(old){s=old;Object.assign(s,b);delete s.method}
  else{s={id:Date.now()+Math.random(),no:S.n++,ts:Date.now(),date:day(),...b};SALES.push(s)}
  clr();
  const ok=await save();
  showMemo(s.id,true,ok);
}

  PAYS.forEach(p=>{if(p.date!==d)return;m[p.method]=(m[p.method]||0)+p.amt;coll+=p.amt});
  return {ss:SALES.filter(s=>s.date===d),ps:PAYS.filter(p=>p.date===d),m,disc:R(disc),total:R(total),due:R(due),coll:R(coll),n};
}

const q_=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csv=r=>'\ufeff'+r.map(x=>x.map(q_).join(',')).join('\r\n');
window.exp=async w=>{
  let t,n;
  if(w==='sales'){
    const r=[['Memo','Date','Time','Customer','Phone','Fruit','Type','Qty_kg','Price_per_kg','Line_amount','Subtotal','Discount','Memo_total','Cash','bKash','Nagad','Due']];
    SALES.forEach(s=>{const p=payOf(s);s.items.forEach(l=>r.push([s.no,s.date,tm(s.ts),s.name,s.phone,l.name,l.mode==='w'?'kg':'amount',l.mode==='w'?l.qty:'',l.mode==='w'?l.price:'',l.amt,s.sub||s.total+(s.disc||0),s.disc||0,s.total,p.Cash||0,p.bKash||0,p.Nagad||0,s.due]))});
    t=csv(r);n='fruitshop-sales-'+day()+'.csv';
  }else if(w==='days'){
    const byDate={};
    SALES.forEach(s=>{const b=byDate[s.date]=byDate[s.date]||{n:0,total:0,due:0,disc:0,m:{Cash:0,bKash:0,Nagad:0},coll:0,buys:0,costs:0,waste:0};b.n++;b.total+=s.total;b.due+=s.due||0;b.disc+=s.disc||0;const p=payOf(s);for(const k in p)b.m[k]+=p[k]});
    PAYS.forEach(p=>{const b=byDate[p.date]=byDate[p.date]||{n:0,total:0,due:0,disc:0,m:{Cash:0,bKash:0,Nagad:0},coll:0,buys:0,costs:0,waste:0};b.m[p.method]=(b.m[p.method]||0)+p.amt;b.coll+=p.amt});
    BUYS.forEach(b=>{const d=byDate[b.date]=byDate[b.date]||{n:0,total:0,due:0,disc:0,m:{Cash:0,bKash:0,Nagad:0},coll:0,buys:0,costs:0,waste:0};if(b.kind==='cost')d.costs+=b.amt;else d.buys+=b.amt});
    WASTE.forEach(w=>{const d=byDate[w.date]=byDate[w.date]||{n:0,total:0,due:0,disc:0,m:{Cash:0,bKash:0,Nagad:0},coll:0,buys:0,costs:0,waste:0};d.waste+=w.cost||0});
    const ds=Object.keys(byDate).sort();
    const r=[['Date','Memos','Sales','Discount','Cash','bKash','Nagad','Due_given','Due_collected','Fruit_buying','Extra_costs','Waste','Profit_approx']];
    ds.forEach(d=>{const x=byDate[d];const net=R(x.total-x.buys-x.costs-x.waste);r.push([d,x.n,R(x.total),R(x.disc),R(x.m.Cash),R(x.m.bKash),R(x.m.Nagad),R(x.due),R(x.coll),R(x.buys),R(x.costs),R(x.waste),net])});
    t=csv(r);n='fruitshop-days-'+day()+'.csv';
  }else if(w==='buys'){
    const r=[['Date','Type','Item','Qty','Unit','Rate','Amount','Supplier','Note','Purchase_ID']];
    BUYS.forEach(b=>r.push([b.date,b.kind==='cost'?'Cost':'Fruit',b.name,b.kind==='cost'?'':b.qty,b.unit,b.rate,b.amt,b.supplier,b.note,b.bid||b.id]));
    t=csv(r);n='fruitshop-buys-'+day()+'.csv';
  }else if(w==='pays'){
    const r=[['Date','Customer','Amount','Method']];
    PAYS.forEach(p=>r.push([p.date,p.name,p.amt,p.method]));
    t=csv(r);n='fruitshop-pays-'+day()+'.csv';
  }else if(w==='custs'){
    const r=[['Name','Phone','Memos','Total_spent','Due','Payments']];
    S.custs.forEach(c=>{const st=custStats(c.id);r.push([c.name,c.phone,st.memos,st.total,st.due,st.paid])});
    t=csv(r);n='fruitshop-customers-'+day()+'.csv';
  }else if(w==='waste'){
    const r=[['Date','Fruit','Qty','Reason','Cost']];
    WASTE.forEach(w=>r.push([w.date,w.name,w.qty,w.reason,w.cost]));
    t=csv(r);n='fruitshop-waste-'+day()+'.csv';
  }else{
    t=JSON.stringify({meta:{shop:S.shop,n:S.n,custs:S.custs,prods:S.prods,lastBackup:Date.now(),pin:S.pin},sales:SALES,pays:PAYS,buys:BUYS,waste:WASTE,exportedAt:Date.now()});
    n='fruitshop-backup-'+day()+'.json';
    S.lastBackup=Date.now();await save();
  }
  dl(n,t);
};

async function dl(name,txt){
  try{
    const u=URL.createObjectURL(new Blob([txt],{type:name.endsWith('.json')?'application/json':'text/plain'}));
    const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
    toast('Saved ✔');
    return;
  }catch(e){}
  showText(name,txt);
}
function showText(name,txt){
  sheet(`<h3>${esc(name)}</h3>
   <p class="m">File save not available. Tap Copy, then paste into Notes, Sheets or email.</p>
   <textarea id="tx" readonly style="width:100%;height:200px;font-size:12px;padding:10px;font-family:monospace">${esc(txt)}</textarea>
   <button class="btn" onclick="cpy()">📋 Copy</button>
   <button class="btn alt" onclick="closeS()">Close</button>`);
}
window.cpy=()=>{const t=$('tx');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Copied ✔':'Long-press to copy')};

/* RESTORE */
window.restoreUI=()=>sheet(`<h3>♻️ Restore backup</h3>
 <p class="m">⚠️ This replaces ALL current data.</p>
 <input type="file" accept=".json,.txt" onchange="rf(this)" style="margin:8px 0">
 <p class="m">Or paste backup text</p>
 <textarea id="rt" style="width:100%;height:120px;font-size:12px;padding:10px;margin:8px 0"></textarea>
 <button class="btn" onclick="restoreGo($('rt').value)">Restore</button>
 <button class="btn alt" onclick="closeS()">Cancel</button>`);
window.rf=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreGo(r.result);r.readAsText(f)};
window.restoreGo=t=>{
  let d;try{d=JSON.parse(String(t).replace(/^\ufeff/,''))}catch(e){return toast('Not valid JSON')}
  if(!d||(!d.sales&&!d.meta))return toast('Not a valid backup');
  window.__pend=d;
  const cnt=`${(d.sales||[]).length} sales · ${(d.pays||[]).length} payments · ${(d.buys||[]).length} buys`;
  sheet(`<h3>Confirm restore</h3><p>${cnt}</p><p class="m">Current data will be replaced.</p>
   <button class="btn danger" onclick="doRestore()">Replace everything</button>
   <button class="btn alt" onclick="closeS()">Cancel</button>`);
};
window.doRestore=async()=>{
  const d=window.__pend;if(!d)return;
  if(d.meta){S=Object.assign({},S,d.meta,S.pin?{pin:S.pin}:{})}
  SALES=d.sales||[];PAYS=d.pays||[];BUYS=d.buys||[];WASTE=d.waste||[];
  await dbClear(STORES.sales);await dbClear(STORES.pays);await dbClear(STORES.buys);await dbClear(STORES.waste);
  for(const s of SALES)await dbPut(STORES.sales,s);
  for(const p of PAYS)await dbPut(STORES.pays,p);
  for(const b of BUYS)await dbPut(STORES.buys,b);
  for(const w of WASTE)await dbPut(STORES.waste,w);
  await save();closeS();render();toast('Restored ✔');
};

/* ==========================================================
   BOOT
   ========================================================== */
restoreCart();
init();
</script>
</body>
</html>
